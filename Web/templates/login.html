{% extends "base.html" %}
{% block title %}Iniciar sesión - ERP Inmobiliarias{% endblock %}
{% block content %}
    <div class="auth-wrap">
        <div class="auth-card fade-in">
            <div class="auth-logo">
                <img src="/static/logo.png" alt="ERP Inmobiliarias">
            </div>
            <h1>Iniciar sesión</h1>
            <p class="auth-sub">Ingresá con tu usuario o email.</p>

            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

            <form method="post" action="/login" class="form auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <input type="hidden" name="next" value="{{ next or '/' }}">
                <div class="form-group">
                    <label>Usuario o email</label>
                    <input type="text" name="identificador" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <p class="auth-switch">¿No tenés cuenta? <a href="/registro">Registrate acá</a></p>
        </div>
    </div>
{% endblock %}
